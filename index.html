<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quale delle Tre? - Quiz #14</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.94);
            --text-color: #0f172a;
            --text-muted: #475569;
            --primary-color: #0284c7;
            --border-color: #cbd5e1;
            --btn-bg: #f8fafc;
            --btn-hover: #e0f2fe;
            --correct-bg: #dcfce7;
            --correct-border: #16a34a;
            --correct-text: #14532d;
            --wrong-bg: #fee2e2;
            --wrong-border: #dc2626;
            --wrong-text: #7f1d1d;
        }

        /* Modalità Luce Rossa per osservazioni notturne */
        body.red-mode {
            --bg-color: #050000;
            --card-bg: rgba(25, 0, 0, 0.92);
            --text-color: #ff3333;
            --text-muted: #aa2222;
            --primary-color: #ff0000;
            --border-color: #550000;
            --btn-bg: #280000;
            --btn-hover: #440000;
            --correct-bg: #280a0a;
            --correct-border: #ff4444;
            --correct-text: #ff8888;
            --wrong-bg: #3c0000;
            --wrong-border: #990000;
            --wrong-text: #ff6666;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            /* Sfondo astronomico con gradiente chiaro protettivo in sovrapposizione */
            background: linear-gradient(rgba(241, 245, 249, 0.88), rgba(241, 245, 249, 0.88)), 
                        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 800 800"><radialGradient id="sky" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="%230f172a"/><stop offset="100%" stop-color="%23020617"/></radialGradient><rect width="800" height="800" fill="url(%23sky)"/><g fill="%23ffffff" opacity="0.6"><circle cx="120" cy="150" r="1.5"/><circle cx="450" cy="80" r="1"/><circle cx="700" cy="200" r="2"/><circle cx="300" cy="350" r="1"/><circle cx="150" cy="600" r="1.5"/><circle cx="600" cy="550" r="2"/><circle cx="750" cy="700" r="1"/></g></svg>');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color); 
            padding: 30px 20px; 
            max-width: 680px; 
            margin: auto; 
            box-sizing: border-box;
            transition: background 0.3s, color 0.3s;
        }

        body.red-mode {
            background: #050000;
        }

        /* Pulsante Luce Rossa fissato in alto a destra */
        .top-bar {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
        }

        .red-mode-toggle {
            background-color: #b91c1c;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.2s;
        }

        .red-mode-toggle:hover {
            transform: scale(1.05);
        }

        body.red-mode .red-mode-toggle {
            background-color: #ff0000;
            color: #000000;
        }

        .header-container {
            margin-top: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        h1 { 
            color: var(--primary-color); 
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 600;
        }

        .card { 
            background-color: var(--card-bg); 
            backdrop-filter: blur(4px);
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .q-title { 
            font-weight: bold; 
            margin-bottom: 14px; 
            color: var(--primary-color); 
            font-size: 16px;
            line-height: 1.4;
        }

        button.opt-btn { 
            display: block; 
            width: 100%; 
            margin: 10px 0; 
            padding: 12px 14px; 
            background-color: var(--btn-bg); 
            color: var(--text-color); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            text-align: left; 
            font-size: 14px; 
            cursor: pointer; 
            transition: all 0.2s;
            font-weight: 500;
        }

        button.opt-btn:hover:not(:disabled) { 
            background-color: var(--btn-hover); 
            border-color: var(--primary-color);
            transform: translateY(-1px);
        }

        button.opt-btn:disabled {
            cursor: default;
            opacity: 0.95;
        }

        .feedback { 
            margin-top: 14px; 
            display: none; 
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .feedback.correct { 
            color: var(--correct-text); 
            background-color: var(--correct-bg);
            border: 1px solid var(--correct-border);
        }

        .feedback.wrong { 
            color: var(--wrong-text); 
            background-color: var(--wrong-bg);
            border: 1px solid var(--wrong-border);
        }

        .quiz-actions {
            text-align: center;
            margin: 35px 0 25px 0;
        }

        #submit-btn {
            background-color: #16a34a;
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
            transition: all 0.2s;
        }

        #submit-btn:hover {
            transform: scale(1.02);
            background-color: #15803d;
        }

        body.red-mode #submit-btn {
            background-color: #880000;
            color: #ff3333;
            border: 1px solid #ff0000;
        }

        .restart-btn {
            margin-top: 15px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .result-box {
            display: none;
            text-align: center;
            margin: 25px 0;
            padding: 25px;
            background-color: var(--card-bg);
            border: 2px dashed var(--primary-color);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .result-box.visible {
            display: block;
        }

        .result-score {
            font-size: 1.4em;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .result-emoji {
            font-size: 3.8em;
            margin: 10px 0;
            line-height: 1;
        }

        .result-message {
            font-size: 1.05em;
            color: var(--text-color);
            font-weight: 500;
        }

        footer {
            margin-top: 40px;
            padding-top: 18px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <button class="red-mode-toggle" onclick="toggleRedMode()">🔴 Luce Rossa</button>
</div>

<div class="header-container">
    <h1>✨ Quale delle Tre? - Quiz #14 ✨</h1>
    <div class="subtitle">Astronomia Generale, Astronomia Cinese e Storia tra le Stelle</div>
</div>

<div id="quiz"></div>

<div class="quiz-actions">
    <button id="submit-btn" onclick="concludiTest()">Verifica Punteggio Finale</button>
</div>

<div id="result-box" class="result-box">
    <div id="result-score" class="result-score"></div>
    <div id="result-emoji" class="result-emoji"></div>
    <div id="result-message" class="result-message"></div>
    <button class="restart-btn" onclick="location.reload()">🔄 Ricomincia il Quiz</button>
</div>

<footer>
    idolo1958
</footer>

<script>
const domande = [
    { 
        q: "1. Nella millenaria tradizione dell'astronomia cinese antica, come veniva chiamata storicamente la straordinaria supernova osservata dagli astronomi imperiali nel 1054 nella costellazione del Toro (i cui resti formano oggi la Nebulosa del Granchio)?", 
        opts: [
            "A) «Stella ospite» (Ke Xing)", 
            "B) «Stella del Dragone Celeste»", 
            "C) «Fiamma dell'Imperatore»"
        ], 
        ans: 0,
        exp: "<strong>Spiegazione:</strong> Gli antichi annali cinesi registrarono la comparsa di una «stella ospite» così luminosa da poter essere visibile in pieno giorno per settimane; oggi sappiamo che si trattava dei resti della nebulosa M1."
    },
    { 
        q: "2. In astronomia stellare, come vengono definiti i densi raggruppamenti sferici di centinaia di migliaia di stelle antiche che orbitano attorno al nucleo delle galassie?", 
        opts: [
            "A) Ammassi aperti", 
            "B) Ammassi globulari", 
            "C) Nebulose planetarie"
        ], 
        ans: 1,
        exp: "<strong>Spiegazione:</strong> Gli ammassi globulari sono strutture sferiche molto dense contenenti stelle tra le più antiche dell'Universo, a differenza degli ammassi aperti che sono giovani e situati nei bracci della galassia."
    },
    { 
        q: "3. Quale celebre evento storico e scientifico si verificò nel luglio del 1609 quando Galileo Galilei puntò per la prima volta il suo cannocchiale perfezionato verso la volta celeste?", 
        opts: [
            "A) La scoperta delle lune di Giove, dei crateri lunari e delle fasi di Venere", 
            "B) La prima fotografia spettroscopica della nebulosa di Orione", 
            "C) La misurazione esatta della parallasse stellare annua"
        ], 
        ans: 0,
        exp: "<strong>Spiegazione:</strong> Le osservazioni galileiane del 1609-1610 aprirono l'era dell'astronomia telescopica moderna, demolendo il dogma geocentrico aristotelico."
    },
    { 
        q: "4. Quale importante strumento di misurazione temporale e astronomica, ampiamente sviluppato dagli astronomi cinesi durante la dinastia Song (es. la celebre torre orologio di Su Song nel 1088), integrava meccanismi idraulici complessi e sfere armillari?", 
        opts: [
            "A) La clessidra ad acqua meccanica e sferica", 
            "B) Il sestante ottico a riflessione", 
            "C) Il telescopio riflettore a specchio parabolico"
        ], 
        ans: 0,
        exp: "<strong>Spiegazione:</strong> La torre astronomica di Su Song combinava ingegneria idraulica, uno scappamento a catena e una sfera armillare rotante sincronizzata per tracciare i moti celesti."
    },
    { 
        q: "5. Quale fisico e astronomo danese riuscì per primo a misurare nel 1676 la velocità della luce basandosi sulle disuguaglianze nei tempi delle eclissi dei satelliti di Giove (in particolare Io)?", 
        opts: [
            "A) Christiaan Huygens", 
            "B) Ole Rømer", 
            "C) Giovanni Domenico Cassini"
        ], 
        ans: 1,
        exp: "<strong>Spiegazione:</strong> Ole Rømer notò che i ritardi nelle eclissi di Io variavano a seconda della distanza della Terra da Giove, stimando per primo che la luce ha una velocità finita."
    },
    { 
        q: "6. Nella cosmologia e nell'astronomia imperiale cinese, quale costellazione o asterismo attorno alla Stella Polare (Northern Dipper / Bei Dou) era considerato il fulcro celeste attorno cui ruotava l'intero impero e il cosmo?", 
        opts: [
            "A) Il Carro del Nord o Grande Orsa (Bei Dou)", 
            "B) Le Pleiadi (Mao)", 
            "C) La Via Lattea (Fiume d'Argento)"
        ], 
        ans: 0,
        exp: "<strong>Spiegazione:</strong> Il Grande Carro (Bei Dou, letteralmente il «Mestolo del Nord») rivestiva un'importanza fondamentale nell'astronomia e nella religione cinese per il calendario e la navigazione."
    },
    { 
        q: "7. Quale pianeta del Sistema Solare, caratterizzato da un asse di rotazione quasi completamente coricato sul proprio piano orbitale (inclinazione di circa 98 gradi), fu scoperto dall'astronomo William Herschel nel 1781?", 
        opts: [
            "A) Nettuno", 
            "B) Urano", 
            "C) Saturno"
        ], 
        ans: 1,
        exp: "<strong>Spiegazione:</strong> William Herschel scoprì Urano nel 1781 usando un telescopio di sua costruzione; la sua insolita inclinazione assiale fa sì che i suoi poli siano alternativamente rivolti verso il Sole."
    }
];

const userSelections = new Array(domande.length).fill(null);
const container = document.getElementById("quiz");

domande.forEach((d, i) => {
    const card = document.createElement("div");
    card.className = "card";
        
    let html = `<div class="q-title">${d.q}</div>`;
    d.opts.forEach((opt, optIdx) => {
        html += `<button class="opt-btn" id="btn-${i}-${optIdx}" onclick="check(${i}, ${optIdx})">${opt}</button>`;
    });
    html += `<div id="fb-${i}" class="feedback"></div>`;
        
    card.innerHTML = html;
    container.appendChild(card);
});

function toggleRedMode() {
    document.body.classList.toggle("red-mode");
}

function check(qIdx, optIdx) {
    if (userSelections[qIdx] !== null) return;
    
    userSelections[qIdx] = optIdx;
    
    const fb = document.getElementById(`fb-${qIdx}`);
    const data = domande[qIdx];
    
    fb.style.display = "block";
    
    data.opts.forEach((_, idx) => {
        const btn = document.getElementById(`btn-${qIdx}-${idx}`);
        btn.disabled = true;
        
        if (idx === optIdx) {
            btn.style.borderColor = (optIdx === data.ans) ? 'var(--correct-border)' : 'var(--wrong-border)';
            btn.style.backgroundColor = (optIdx === data.ans) ? 'var(--correct-bg)' : 'var(--wrong-bg)';
        } else if (idx === data.ans) {
            btn.style.borderColor = 'var(--correct-border)';
            btn.style.backgroundColor = 'var(--correct-bg)';
        } else {
            btn.style.borderColor = 'var(--border-color)';
            btn.style.backgroundColor = 'var(--btn-bg)';
        }
    });

    if (optIdx === data.ans) {
        fb.className = "feedback correct";
        fb.innerHTML = `✓ <strong>Esatto!</strong> ${data.exp}`;
    } else {
        fb.className = "feedback wrong";
        fb.innerHTML = `✗ <strong>Errato.</strong> La risposta corretta era la <strong>${data.opts[data.ans]}</strong>.<br>${data.exp}`;
    }
}

function concludiTest() {
    let score = 0;
    domande.forEach((d, i) => {
        if (userSelections[i] === d.ans) {
            score++;
        }
    });

    const resultBox = document.getElementById('result-box');
    const resultScore = document.getElementById('result-score');
    const resultEmoji = document.getElementById('result-emoji');
    const resultMessage = document.getElementById('result-message');

    resultScore.innerText = `Punteggio Finale: ${score} su ${domande.length}`;

    if (score <= 2) {
        resultEmoji.innerText = "😢";
        resultMessage.innerText = "Peccato! Rileggi le spiegazioni per ciascun quesito e riprova il test per migliorare!";
    } else if (score <= 4) {
        resultEmoji.innerText = "🙂";
        resultMessage.innerText = "Buon tentativo! Hai una discreta conoscenza di base, puoi fare ancora meglio!";
    } else if (score <= 6) {
        resultEmoji.innerText = "😊";
        resultMessage.innerText = "Molto bene! Dimostri un'ottima preparazione complessiva!";
    } else {
        resultEmoji.innerText = "🤩";
        resultMessage.innerText = "Eccellente! Punteggio pieno, sei un vero esperto di astronomia, storia e culture celesti!";
    }

    resultBox.classList.add('visible');
    resultBox.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
